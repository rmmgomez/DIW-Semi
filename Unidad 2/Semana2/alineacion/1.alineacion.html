<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard con CSS Grid</title>
    <link rel="stylesheet" href="1.alineacion.css">
</head>

<body>

    <header>
        <h1>Dashboard con CSS Grid</h1>
    </header>

    <main>
        <article class="item-1">1. Default<p>justify: start<br>align: start</p>
        </article>
        <article class="item-2">2. Ancho<p>justify-self: stretch</p>
        </article>
        <article class="item-3">3. Abajo<p>align-self: end</p>
        </article>
        <article class="item-4">4. Centrado<p>place-self: center</p>
        </article>
        <article class="item-5">5. Alto<p>align-self: stretch</p>
        </article>
        <article class="item-6">6. Default<p>justify: start<br>align: start</p>
        </article>
    </main>

</body>

</html>

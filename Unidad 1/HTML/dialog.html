<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <h1>Ejemplo modal con sólo HTML</h1>
  <button command="show-modal" commandfor="my-dialog">Open dialog</button>
  <dialog id="my-dialog" closedby="any">
    <p>Ejemplo de modal sin CSS (feo entonces)</p>
    <form method="dialog">
      <button>Cerrar modal</button>
    </form>
  </dialog>
</body>

</html>
